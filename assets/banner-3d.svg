<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05010f"/>
      <stop offset="0.6" stop-color="#120830"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="0.5" stop-color="#7b2ff7"/>
      <stop offset="1" stop-color="#ff3cac"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="grid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff3cac" stop-opacity="0"/>
      <stop offset="1" stop-color="#ff3cac" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff3cac" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7b2ff7" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="floor"><rect x="0" y="200" width="1200" height="120"/></clipPath>
    <style>
      .star{fill:#fff;animation:tw 3s ease-in-out infinite}
      @keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
      .h{stroke:url(#grid);stroke-width:1.2}
      .move{animation:mv 1.6s linear infinite}
      @keyframes mv{from{transform:translateY(0)}to{transform:translateY(24px)}}
      .cube{animation:fl 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      @keyframes fl{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-14px) rotate(8deg)}}
      .title{font:800 58px 'Segoe UI',Verdana,sans-serif;letter-spacing:2px}
      .sub{font:600 20px 'Fira Code',Consolas,monospace;fill:#e6edf3;letter-spacing:3px}
      .fade{animation:fd 4s ease-in-out infinite}
      @keyframes fd{0%,100%{opacity:.75}50%{opacity:1}}
    </style>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- estrellas -->
  <g>
    <circle class="star" cx="80" cy="40" r="1.4"/>
    <circle class="star" cx="210" cy="90" r="1" style="animation-delay:.6s"/>
    <circle class="star" cx="330" cy="30" r="1.6" style="animation-delay:1.2s"/>
    <circle class="star" cx="470" cy="70" r="1" style="animation-delay:.3s"/>
    <circle class="star" cx="760" cy="35" r="1.3" style="animation-delay:1.8s"/>
    <circle class="star" cx="880" cy="95" r="1" style="animation-delay:.9s"/>
    <circle class="star" cx="1010" cy="45" r="1.5" style="animation-delay:2.1s"/>
    <circle class="star" cx="1130" cy="80" r="1.1" style="animation-delay:1.5s"/>
    <circle class="star" cx="620" cy="20" r="1.2" style="animation-delay:2.4s"/>
    <circle class="star" cx="150" cy="150" r="1" style="animation-delay:.2s"/>
    <circle class="star" cx="1060" cy="160" r="1" style="animation-delay:1s"/>
  </g>

  <!-- sol -->
  <circle cx="600" cy="200" r="190" fill="url(#sun)"/>

  <!-- suelo en perspectiva -->
  <g clip-path="url(#floor)">
    <g class="h">
      <line x1="600" y1="200" x2="-600" y2="320"/>
      <line x1="600" y1="200" x2="-300" y2="320"/>
      <line x1="600" y1="200" x2="0" y2="320"/>
      <line x1="600" y1="200" x2="200" y2="320"/>
      <line x1="600" y1="200" x2="400" y2="320"/>
      <line x1="600" y1="200" x2="600" y2="320"/>
      <line x1="600" y1="200" x2="800" y2="320"/>
      <line x1="600" y1="200" x2="1000" y2="320"/>
      <line x1="600" y1="200" x2="1200" y2="320"/>
      <line x1="600" y1="200" x2="1500" y2="320"/>
      <line x1="600" y1="200" x2="1800" y2="320"/>
    </g>
    <g class="move" stroke="#ff3cac" stroke-opacity=".55" stroke-width="1.2">
      <line x1="0" y1="186" x2="1200" y2="186"/>
      <line x1="0" y1="204" x2="1200" y2="204"/>
      <line x1="0" y1="226" x2="1200" y2="226"/>
      <line x1="0" y1="250" x2="1200" y2="250"/>
      <line x1="0" y1="274" x2="1200" y2="274"/>
      <line x1="0" y1="298" x2="1200" y2="298"/>
    </g>
  </g>
  <line x1="0" y1="200" x2="1200" y2="200" stroke="#00f0ff" stroke-opacity=".6"/>

  <!-- cubos 3D flotantes -->
  <g transform="translate(130 120)"><g class="cube">
    <polygon points="0,14 24,0 48,14 24,28" fill="#00f0ff" opacity=".9"/>
    <polygon points="0,14 24,28 24,56 0,42" fill="#0089a3"/>
    <polygon points="48,14 24,28 24,56 48,42" fill="#005c70"/>
  </g></g>
  <g transform="translate(1030 110)"><g class="cube" style="animation-delay:-3s">
    <polygon points="0,12 20,0 40,12 20,24" fill="#ff3cac" opacity=".9"/>
    <polygon points="0,12 20,24 20,48 0,36" fill="#b0207a"/>
    <polygon points="40,12 20,24 20,48 40,36" fill="#7a1454"/>
  </g></g>
  <g transform="translate(260 60)"><g class="cube" style="animation-delay:-1.5s">
    <polygon points="0,8 14,0 28,8 14,16" fill="#7b2ff7"/>
    <polygon points="0,8 14,16 14,32 0,24" fill="#5420ad"/>
    <polygon points="28,8 14,16 14,32 28,24" fill="#3a1678"/>
  </g></g>
  <g transform="translate(920 50)"><g class="cube" style="animation-delay:-4.5s">
    <polygon points="0,8 14,0 28,8 14,16" fill="#00f0ff"/>
    <polygon points="0,8 14,16 14,32 0,24" fill="#0089a3"/>
    <polygon points="28,8 14,16 14,32 28,24" fill="#005c70"/>
  </g></g>

  <!-- título -->
  <g text-anchor="middle">
    <text x="603" y="128" class="title" fill="#000" opacity=".5">DANIEL IZQUIERDO</text>
    <text x="600" y="124" class="title" fill="url(#txt)" filter="url(#glow)">DANIEL IZQUIERDO</text>
    <text x="600" y="168" class="sub fade">AI SOFTWARE ENGINEER · IoT DEVELOPER</text>
  </g>
</svg>
